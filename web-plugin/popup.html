<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AccessCity — Explore in 3D</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; font-size: 13px; color: #e8e8e8; background: #1a1a1a; }
    label { display: block; margin-top: 8px; color: #aaa; }
    input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; }
    button.primary { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 4px; background: #76b900; color: #fff; font-weight: 600; cursor: pointer; }
    button.primary:hover { background: #8dd200; }
    .hint { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }
    .status { font-size: 11px; margin-top: 8px; min-height: 2.6em; color: #c9a227; }
    .err { color: #e66; }
    .ok { color: #8d8; }
  </style>
</head>
<body>
  <div><strong>Explore in AccessCity</strong></div>
  <label>Latitude (WGS84)</label>
  <input id="lat" type="text" inputmode="decimal" autocomplete="off" />
  <label>Longitude</label>
  <input id="lon" type="text" inputmode="decimal" autocomplete="off" />
  <button class="primary" id="explore" type="button">Explore in AccessCity</button>
  <div class="status" id="status"></div>
  <script src="parseUrlToGeo.js"></script>
  <script src="popup.js"></script>
</body>
</html>
